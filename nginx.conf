
server {
    listen 8080;

    # Публичный маршрут подписок
    location ^~ /api/sub/ {
        proxy_pass https://panel.drive-google.ru;
        proxy_ssl_server_name on;
        proxy_ssl_name panel.drive-google.ru;

        proxy_set_header Host panel.drive-google.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Остальные запросы панели
    location / {
        proxy_pass https://panel.drive-google.ru;
        proxy_ssl_server_name on;
        proxy_ssl_name panel.drive-google.ru;

        proxy_set_header Host panel.drive-google.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}


